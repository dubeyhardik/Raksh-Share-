<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raksh Share</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5fa;
 color:#172033;
}
header{
 background:#101827;
 color:white;
 padding:22px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{font-size:22px;font-weight:bold}
.logo span{color:#8caaff}
.container{max-width:900px;margin:35px auto;padding:15px}
.card{
 background:white;
 padding:25px;
 border-radius:15px;
 margin-bottom:20px;
 box-shadow:0 5px 25px #00000008;
}
h2{margin-top:0}
input{
 width:100%;
 padding:14px;
 margin:8px 0 15px;
 border:1px solid #ddd;
 border-radius:8px;
 font-size:15px;
}
button{
 padding:12px 17px;
 border:0;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold;
}
.primary{background:#315bd6;color:white}
.secondary{background:#e9edfa;color:#263b70}
.danger{background:#ffe9e9;color:#bd3030}
.hidden{display:none}
.item{
 padding:17px;
 border:1px solid #eee;
 border-radius:10px;
 margin-top:12px;
 overflow-wrap:anywhere;
}
.item small{display:block;color:#777;margin:8px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:14px;margin-top:12px}
@media(max-width:600px){
 .container{margin:15px auto}
 .card{padding:19px}
}
</style>
</head>

<body>

<header>
 <div class="logo">RAKSH <span>SHARE</span></div>
 <button id="logout" class="hidden">Logout</button>
</header>

<div class="container">

<section id="login" class="card">
 <h2>Admin Login</h2>

 <input id="email" type="email" placeholder="Admin email">
 <input id="password" type="password" placeholder="Password">

 <button class="primary" onclick="login()">Login</button>

 <p id="loginStatus" class="status"></p>
</section>

<section id="dashboard" class="hidden">

 <div class="card">
  <h2>Share a Website</h2>

  <label>Website Name</label>
  <input id="siteName" placeholder="BizSouls">

  <label>Website URL</label>
  <input id="siteUrl" type="url"
  placeholder="https://example.github.io/">

  <button class="primary" onclick="createLink()">
   Generate Sharing Link
  </button>

  <p id="createStatus" class="status"></p>
 </div>

 <div class="card">
  <h2>My Shared Websites</h2>
  <div id="links">Loading...</div>
 </div>

</section>
</div>

<script>

// ADD YOUR SUPABASE PROJECT DETAILS
const SUPABASE_URL="YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_PUBLIC_KEY";

const db=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const $=id=>document.getElementById(id);

const sharePage=new URL("share.html",location.href).href;

function randomCode(){
 return crypto.randomUUID().replaceAll("-","").slice(0,10);
}

function safe(value){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

async function login(){
 $("loginStatus").textContent="Signing in...";

 const {error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });

 if(error){
  $("loginStatus").textContent=error.message;
  return;
 }

 await checkLogin();
}

async function checkLogin(){
 const {data:{session}}=await db.auth.getSession();

 $("login").classList.toggle("hidden",!!session);
 $("dashboard").classList.toggle("hidden",!session);
 $("logout").classList.toggle("hidden",!session);

 if(session) loadLinks();
}

$("logout").onclick=async()=>{
 await db.auth.signOut();
 checkLogin();
};

async function createLink(){

 const name=$("siteName").value.trim();
 const url=$("siteUrl").value.trim();

 if(!name){
  $("createStatus").textContent="Enter website name.";
  return;
 }

 try{
  const parsed=new URL(url);
  if(!["https:","http:"].includes(parsed.protocol))
   throw new Error();
 }catch{
  $("createStatus").textContent="Enter a valid website URL.";
  return;
 }

 $("createStatus").textContent="Creating link...";

 const {data:{user}}=await db.auth.getUser();

 const {error}=await db.from("shares").insert({
  slug:randomCode(),
  title:name,
  target_url:url,
  created_by:user.id,
  is_active:true
 });

 if(error){
  $("createStatus").textContent=error.message;
  return;
 }

 $("siteName").value="";
 $("siteUrl").value="";

 $("createStatus").textContent="Sharing link created!";

 loadLinks();
}

async function loadLinks(){

 const {data,error}=await db.from("shares")
 .select("*")
 .order("created_at",{ascending:false});

 if(error){
  $("links").textContent=error.message;
  return;
 }

 if(!data.length){
  $("links").textContent="No websites shared yet.";
  return;
 }

 $("links").innerHTML="";

 data.forEach(item=>{

  const link=sharePage+"?id="+encodeURIComponent(item.slug);

  const div=document.createElement("div");
  div.className="item";

  div.innerHTML=`
   <strong>${safe(item.title)}</strong>
   <small>${safe(item.target_url)}</small>
   <small>${safe(link)}</small>

   <div class="actions">
    <button class="secondary">Copy Link</button>
    <button class="${item.is_active?"danger":"primary"}">
     ${item.is_active?"Deactivate":"Activate"}
    </button>
   </div>
  `;

  const buttons=div.querySelectorAll("button");

  buttons[0].onclick=async()=>{
   try{
    await navigator.clipboard.writeText(link);
    buttons[0].textContent="Copied!";
   }catch{
    prompt("Copy sharing link:",link);
   }
  };

  buttons[1].onclick=async()=>{
   const {error}=await db.from("shares")
    .update({is_active:!item.is_active})
    .eq("id",item.id);

   if(error) alert(error.message);
   else loadLinks();
  };

  $("links").appendChild(div);
 });
}

db.auth.onAuthStateChange(()=>checkLogin());
checkLogin();

</script>
</body>
</html>
